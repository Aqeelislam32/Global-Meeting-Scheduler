system_prompt: "You are a helpful AI assistant that provides timezone conversions and meeting scheduling."

timezone_conversion:
  user_prompt: "Convert {time} from {from_timezone} to {to_timezone}. Return only the converted time."

meeting_scheduler:
  user_prompt: "Schedule a meeting at {time} in {from_timezone} and provide the equivalent time in {to_timezone}."

general:
  user_prompt: "Assist the user with timezone conversions and scheduling meetings. Ensure responses are clear and accurate."

planning:
  prompt: "Based on the user's goal, outline a step-by-step plan."

final_answer:
  prompt: "Based on all steps and intermediate answers, give a final answer in simple terms."

managed_agent:
  prompt: "You're the main agent. Use the plan and tools to assist the user effectively."
